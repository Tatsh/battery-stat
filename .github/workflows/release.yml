concurrency:
  cancel-in-progress: false
  group: '${{ github.workflow }}-${{ github.event.workflow_run.head_sha }}'
env:
  GH_REPO: '${{ github.repository }}'
  GH_TOKEN: '${{ github.token }}'
jobs:
  publish-release:
    name: 'Publish the release'
    permissions:
      actions: 'read'
      contents: 'write'
    runs-on: 'ubuntu-latest'
    steps:
      # A run follows each Build of every commit. It goes on only for a commit a v* tag names, after
      # Build succeeded.
      - env:
          HEAD_SHA: '${{ github.event.workflow_run.head_sha }}'
          TRIGGER_CONCLUSION: '${{ github.event.workflow_run.conclusion }}'
        id: 'guard'
        name: 'Find the tag of the commit'
        run: |
          if [[ "$TRIGGER_CONCLUSION" != 'success' ]]; then
            echo "The triggering workflow concluded with '${TRIGGER_CONCLUSION}'."
            exit 0
          fi
          tag=''
          while IFS=$'\t' read -r ref obj_type obj_sha; do
            [[ -z "$ref" ]] && continue
            if [[ "$obj_type" == 'commit' ]]; then
              target_sha="$obj_sha"
            else
              target_sha=$(gh api "repos/${GH_REPO}/git/tags/${obj_sha}" --jq '.object.sha' \
                2> /dev/null || echo '')
            fi
            if [[ "$target_sha" == "$HEAD_SHA" ]]; then
              tag="${ref#refs/tags/}"
              break
            fi
          done < <(gh api "repos/${GH_REPO}/git/matching-refs/tags/v" \
            --jq '.[] | [.ref, .object.type, .object.sha] | @tsv')
          if [[ -z "$tag" ]]; then
            echo "No v* tag names ${HEAD_SHA}."
            exit 0
          fi
          echo "The tag of ${HEAD_SHA} is ${tag}."
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
      # The Build of the branch can finish before the Build of the tag creates the draft.
      - env:
          TAG: '${{ steps.guard.outputs.tag }}'
        id: 'check'
        if: "steps.guard.outputs.tag != ''"
        name: 'Check that every package is attached'
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            echo "Build has not created the draft of ${TAG} yet."
            exit 0
          fi
          required=(
            "battery-stat-${TAG}-macos-universal-Release.pkg"
            "battery-stat-${TAG}-macos-universal-Release"
          )
          mapfile -t attached < <(gh release view "$TAG" --json assets --jq '.assets[].name')
          echo "${TAG} has ${#attached[@]} packages attached."
          missing=0
          for name in "${required[@]}"; do
            if ! printf '%s\n' "${attached[@]}" | grep -Fxq "$name"; then
              echo "::warning::${TAG} has no ${name}."
              missing=$((missing + 1))
            fi
          done
          if [[ "$missing" -gt 0 ]]; then
            echo "::warning::${missing} packages are missing, and ${TAG} stays a draft."
            exit 0
          fi
          for name in "${attached[@]}"; do
            if ! printf '%s\n' "${required[@]}" | grep -Fxq "$name"; then
              echo "::error::${TAG} has an unexpected asset ${name}." \
                'Only Release packages are allowed.'
              exit 1
            fi
          done
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - env:
          TAG: '${{ steps.guard.outputs.tag }}'
        if: "steps.check.outputs.ready == 'true'"
        name: 'Publish the release'
        run: 'gh release edit "$TAG" --draft=false'
name: 'Release'
'on':
  workflow_run:
    types: ['completed']
    workflows: ['Build']
permissions: {}
