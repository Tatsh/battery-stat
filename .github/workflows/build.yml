concurrency:
  cancel-in-progress: true
  group: 'build-${{ github.ref }}'
jobs:
  macos:
    env:
      PACKAGE: 'battery-stat-${{ needs.version.outputs.version }}-macos-universal-Release'
    name: 'macOS universal'
    needs: 'version'
    permissions:
      attestations: 'write'
      contents: 'read'
      id-token: 'write'
    runs-on: 'macos-latest'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      # The x86_64 slice runs on macOS 10.13 and later. Apple silicon starts at macOS 11. The linker
      # signs only the arm64 slice, so both are signed ad hoc again.
      - env:
          MACOSX_DEPLOYMENT_TARGET: '10.13'
        name: 'Compile'
        run: |
          make TARGET_ARCH='-arch arm64 -arch x86_64'
          codesign --force --sign - battery_stat
      # The runner has no battery, so the only error allowed is the one for a missing battery.
      - name: 'Verify the binary'
        run: |
          [[ "$(lipo -archs battery_stat)" =~ ^(x86_64 arm64|arm64 x86_64)$ ]]
          codesign --verify battery_stat
          for architecture in arm64 x86_64; do
            if ! arch "-$architecture" ./battery_stat json 2> stderr.txt; then
              grep -Fqx 'failed to retrieve battery info' stderr.txt
            fi
          done
      - name: 'Package'
        run: |
          mkdir -p pkg-root/usr/local/bin pkg-build
          install -m 755 battery_stat pkg-root/usr/local/bin/battery-stat
          # Extended attributes would add AppleDouble files to the package.
          xattr -cr pkg-root
          install -m 755 battery_stat "$PACKAGE"
          version="${VERSION#v}"
          [[ "$version" =~ ^[0-9]+(\.[0-9]+)*$ ]] || version=0
          pkgbuild --root pkg-root --identifier sh.tat.battery-stat --version "$version" \
            --install-location / pkg-build/battery-stat.pkg
          productbuild --distribution packaging/distribution.xml --package-path pkg-build \
            "$PACKAGE.pkg"
          pkgutil --payload-files "$PACKAGE.pkg" | grep -Fx ./usr/local/bin/battery-stat
        env:
          VERSION: '${{ needs.version.outputs.version }}'
      - if: "github.event_name != 'pull_request'"
        name: 'Attest the packages'
        uses: 'actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8'
        with:
          subject-path: |
            ${{ env.PACKAGE }}
            ${{ env.PACKAGE }}.pkg
      - name: 'Upload the packages'
        uses: 'actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9'
        with:
          if-no-files-found: 'error'
          name: '${{ env.PACKAGE }}'
          path: |
            ${{ env.PACKAGE }}
            ${{ env.PACKAGE }}.pkg
  # On a tag, the packages go to a draft release, which the Release workflow publishes once Build
  # succeeds.
  release:
    if: "github.ref_type == 'tag'"
    name: 'Attach to the release'
    needs: ['macos']
    permissions:
      contents: 'write'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333'
        with:
          merge-multiple: true
          path: 'packages'
          pattern: 'battery-stat-*-Release'
      - name: 'List the packages'
        run: |
          find packages -maxdepth 1 -type f | sort > packages.txt
          cat packages.txt
      - env:
          GH_REPO: '${{ github.repository }}'
          GH_TOKEN: '${{ github.token }}'
          TAG: '${{ github.ref_name }}'
        name: 'Upload to the draft release'
        run: |
          gh release view "$TAG" > /dev/null 2>&1 \
            || gh release create "$TAG" --draft --notes '' --title "$TAG" --verify-tag
          xargs -d '\n' gh release upload "$TAG" --clobber < packages.txt
  version:
    name: 'Package version'
    outputs:
      version: '${{ steps.version.outputs.version }}'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: 'version'
        name: 'Select the tag or seven-character SHA'
        run: |
          version="${GITHUB_SHA:0:7}"
          if tag=$(git describe --tags --exact-match HEAD 2> /dev/null); then
            version="v${tag#v}"
            version="${version//\//-}"
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
name: 'Build'
'on':
  pull_request:
    branches:
      - 'master'
  push:
    branches:
      - 'master'
    tags:
      - 'v*.*.*'
permissions:
  contents: 'read'
